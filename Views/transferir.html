<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transferir - Sistema Bancario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <script defer src="/static/js/transferir.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Sistema Bancario</a>
    <div class="dropdown">
      <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Menú
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="/crear">Crear cuenta</a></li>
        <li><a class="dropdown-item" href="/transferir">Transferir</a></li>
        <li><a class="dropdown-item" href="/listado">Cuentas</a></li>
      </ul>
    </div>
  </div>
  </nav>

<div class="container my-4">
  <div class="col-12 col-lg-6 mx-auto">
    <div class="card shadow-sm">
      <div class="card-header">Transferir</div>
      <div class="card-body">
        <form id="form-transferir" class="row g-3">
          <div class="col-6">
            <label class="form-label">Cuenta origen (ID)</label>
            <input type="number" id="id_origen" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Cuenta destino (ID)</label>
            <input type="number" id="id_destino" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Monto</label>
            <input type="number" id="monto" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Referencia</label>
            <input type="text" id="referencia" class="form-control" placeholder="Se generará automáticamente si se deja vacío">
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <input type="text" id="descripcion" class="form-control">
          </div>
          <input type="hidden" id="id_tipo_transaccion" value="1">
          <div class="col-12">
            <button type="submit" class="btn btn-success w-100">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
